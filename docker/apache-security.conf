<Directory "/var/www/html">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Neleisti tiesiogiai skaityti repozitorijos / konfigūracijos / SQL failų.
<FilesMatch "(?i)^(?:\..*|.*\.(?:sql|env|ini|log|md|ya?ml|lock|bak|sh)|Dockerfile|LICENSE)$">
    Require all denied
</FilesMatch>
RedirectMatch 404 ^/\.git(?:/|$)
RedirectMatch 404 ^/docker(?:/|$)
RedirectMatch 404 ^/include/(?:nustatymai|functions)\.php$
